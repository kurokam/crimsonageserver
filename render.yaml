# Render "Blueprint": bu dosya, sunucu klasörünün (server/ içeriği) GitHub deposunun KÖKÜNDE durmalıdır.
services:
  - type: web
    name: kizil-cag-server
    runtime: node
    plan: free                  # ücretsiz: skorlar sunucu yeniden başlayınca silinir (aşağıdaki disk satırlarına bakın)
    buildCommand: "echo no build"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "20"
    # Skorların kalıcı olması için (ücretli plan gerekir): plan'ı 'starter' yapın ve aşağıyı açın
    # plan: starter
    # disk:
    #   name: kizil-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars içine ekleyin:  - key: DATA_FILE   value: /var/data/data.json
